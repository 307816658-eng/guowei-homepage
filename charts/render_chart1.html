<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B1120;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      width: 760px;
      height: 440px;
      overflow: hidden;
    }
    .card {
      background: #161F36;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      padding: 24px;
      height: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #D4AF37;
      border-radius: 50%;
    }
    .title {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 700;
    }
    .badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #F87171;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .desc {
      color: #94A3B8;
      font-size: 12px;
      margin-bottom: 12px;
    }
    #chart {
      width: 710px;
      height: 290px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-box">
        <div class="dot"></div>
        <div class="title">芝华仕·庐江店 线上意向金额 vs 实际核销（近一年）</div>
      </div>
      <div class="badge">核销率 0% · 退款率 100%</div>
    </div>
    <div class="desc">数据洞察：100% 依赖总部大场直播带货，线上领券 0 到店核销，存在完全闭环断层</div>
    <div id="chart"></div>
  </div>

  <script>
    const chart = echarts.init(document.getElementById('chart'), null, { devicePixelRatio: 2 });
    chart.setOption({
      backgroundColor: 'transparent',
      animation: false,
      grid: {
        top: '18%',
        left: '4%',
        right: '4%',
        bottom: '8%',
        containLabel: true
      },
      xAxis: {
        type: 'category',
        data: ['意向领券金额 (总部直播)', '门店实际到店核销', '退款流失总额'],
        axisLine: { lineStyle: { color: '#334155' } },
        axisLabel: { color: '#E2E8F0', fontSize: 13, fontWeight: 'bold' }
      },
      yAxis: {
        type: 'value',
        axisLine: { show: false },
        splitLine: { lineStyle: { color: '#1E293B' } },
        axisLabel: { color: '#94A3B8', formatter: '¥{value}' }
      },
      series: [
        {
          name: '金额 (元)',
          type: 'bar',
          barWidth: '45%',
          data: [
            { value: 7615, itemStyle: { color: '#D4AF37', borderRadius: [8, 8, 0, 0] } },
            { value: 0, itemStyle: { color: '#EF4444', borderRadius: [8, 8, 0, 0] } },
            { value: 7615, itemStyle: { color: '#64748B', borderRadius: [8, 8, 0, 0] } }
          ],
          label: {
            show: true,
            position: 'top',
            formatter: function(params) {
              return params.value === 0 ? '¥0 (到店0核销)' : '¥' + params.value + ' (8张券)';
            },
            color: '#FFFFFF',
            fontSize: 13,
            fontWeight: 'bold',
            offset: [0, -4]
          }
        }
      ]
    });
  </script>
</body>
</html>
